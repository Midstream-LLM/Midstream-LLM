[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jishui"
version = "0.1.0"
description = "Jishui classical Chinese decoder-only language model"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "mlx>=0.32,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
torch = ["torch>=2.6,<2.7", "safetensors>=0.5,<1"]
tracking = ["wandb>=0.30,<1"]
corpus = ["opencc-python-reimplemented>=0.1.7,<0.2", "pyarrow>=17.0"]

[project.scripts]
jishui-train-torch = "jishui.pretrain_torch:main"
jishui-train-mlx = "jishui.train_mlx:main"
jishui-generate-mlx = "jishui.generate_mlx:main"
jishui-generate-torch = "jishui.generate_torch:main"
jishui-torch-runtime = "jishui.train_torch:main"
jishui-prepare-corpus = "jishui.prepare_corpus:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
